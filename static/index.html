<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orderflow Terminal</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e11;--pn:#161a1e;--ln:#2b3139;--tx:#eaecef;--mu:#848e9c;--up:#0ecb81;--dn:#f6465d;--ac:#f0b90b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
header::-webkit-scrollbar{display:none}
button,input,select{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;transition:background .15s,border-color .15s,color .15s,transform .1s}
button{cursor:pointer;flex:none}button:active{transform:scale(.96)}
button:hover{border-color:var(--mu)}button.on{background:var(--ac);border-color:var(--ac);color:#000;font-weight:600}
input:focus,select:focus{outline:none;border-color:var(--ac)}
#sym{width:110px;font-weight:600;text-transform:uppercase}.sep{width:1px;height:20px;background:var(--ln);flex:none}
#wrap{position:relative;flex:1;min-height:0}#chart,#fp{position:absolute;inset:0}#fp{pointer-events:none;width:100%;height:100%}
#card{position:absolute;left:10px;top:10px;z-index:5;max-width:calc(100% - 20px);background:rgba(22,26,30,.92);backdrop-filter:blur(6px);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;display:none;transition:opacity .2s}
#card b.buy{color:var(--up)}#card b.sell{color:var(--dn)}#card .g{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;color:var(--mu)}#card .g span b{color:var(--tx);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim.show{opacity:1;pointer-events:auto}
.modal{width:min(420px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px;transform:translateY(12px) scale(.98);transition:transform .25s}
.scrim.show .modal{transform:none}.modal h3{margin-bottom:12px}.modal label{display:block;color:var(--mu);margin:10px 0 4px}.modal input{width:100%}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row button{flex:1}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);background:var(--pn);border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:15;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px}
#drawer.show{transform:none}#drawer .hd{display:flex;justify-content:space-between;align-items:center;font-weight:600}
#add{display:flex;gap:6px}#add input{flex:1;min-width:0;text-transform:uppercase}#list{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;cursor:pointer}.it:hover{border-color:var(--mu)}
.it .n{flex:1;font-weight:600;min-width:0}.it .p{color:var(--mu)}.it button{padding:3px 8px}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;font-weight:700}.tag.BUY{background:rgba(14,203,129,.2);color:var(--up)}.tag.SELL{background:rgba(246,70,93,.2);color:var(--dn)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--pn);border:1px solid var(--ln);padding:8px 14px;border-radius:10px;opacity:0;transition:.25s;z-index:30;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){header{gap:6px;padding:6px}button,select,input{padding:5px 8px;font-size:12px}#sym{width:92px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app">
<header>
<input id="sym" value="BTCUSDT" spellcheck="false" autocomplete="off" aria-label="Symbol">
<div id="tfs" style="display:flex;gap:4px"></div><span class="sep"></span>
<select id="mode"><option value="scalping">Scalping</option><option value="day">Day</option><option value="swing">Swing</option></select>
<button id="bfp">Footprint</button><button id="bsig">Signal</button><span class="sep"></span>
<button id="bwl" title="Watchlist">★ Watchlist</button><button id="bset" title="Settings">⚙</button>
</header>
<div id="wrap"><div id="chart"></div><canvas id="fp"></canvas><div id="card"></div></div></div>
<aside id="drawer"><div class="hd"><span>Watchlist <span id="cnt" style="color:var(--mu)"></span></span><button id="xwl">✕</button></div>
<div id="add"><input id="ns" placeholder="Add pair, e.g. SOL" spellcheck="false"><button id="badd">Add</button></div><div id="list"></div></aside>
<div class="scrim" id="scrim"><div class="modal"><h3>Settings</h3>
<label>Telegram bot token</label><input id="tt" placeholder="123456:ABC..." autocomplete="off">
<label>Telegram chat ID</label><input id="tc" placeholder="e.g. 123456789" autocomplete="off">
<div class="row"><button id="btest">Send test</button><button id="bsave" class="on">Save</button><button id="bclose">Close</button></div></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),TF={"1m":60,"5m":300,"15m":900,"1h":3600,"4h":14400,"1d":86400};
let sym=localStorage.sym||"BTCUSDT",tf=localStorage.tf||"15m",fpOn=false,sigOn=false,candles=[],FPD=null,SIG=null,lines=[],wsk;
const api=async(u,o)=>{const r=await fetch(u,o&&{method:o.m,headers:{"Content-Type":"application/json"},body:JSON.stringify(o.b)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||"Request failed");return j};
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)};
const chart=LightweightCharts.createChart($("#chart"),{autoSize:true,layout:{background:{color:"#0b0e11"},textColor:"#848e9c"},
 grid:{vertLines:{color:"#161a1e"},horzLines:{color:"#161a1e"}},rightPriceScale:{borderColor:"#2b3139"},
 timeScale:{borderColor:"#2b3139",timeVisible:true,rightOffset:8},crosshair:{mode:0}});
const ser=chart.addCandlestickSeries({upColor:"#0ecb81",downColor:"#f6465d",wickUpColor:"#0ecb81",wickDownColor:"#f6465d",borderVisible:false});
const fmt=x=>x==null?"–":(+x).toLocaleString(undefined,{maximumFractionDigits:x<1?6:x<100?4:2});

async function load(){
 try{candles=await api(`/api/klines?symbol=${sym}&tf=${tf}`)}catch(e){toast(e.message);return}
 ser.setData(candles);chart.timeScale().scrollToRealTime();localStorage.sym=sym;localStorage.tf=tf;
 wsk&&wsk.readyState==1&&wsk.send(JSON.stringify({symbol:sym}));FPD=null;loadFP();loadSig()}
function tick(p){const L=candles[candles.length-1];if(!L)return;const bt=Math.floor(Date.now()/1000/TF[tf])*TF[tf];
 if(bt>L.time)candles.push({time:bt,open:p,high:p,low:p,close:p});else{L.high=Math.max(L.high,p);L.low=Math.min(L.low,p);L.close=p}
 ser.update(candles[candles.length-1])}

/* footprint overlay */
async function loadFP(){if(!fpOn)return;try{FPD=await api(`/api/footprint?symbol=${sym}&tf=${tf}`)}catch(e){}}
let sig0="";
function draw(){const cv=$("#fp"),w=cv.clientWidth,h=cv.clientHeight,d=devicePixelRatio||1;
 if(cv.width!=w*d||cv.height!=h*d){cv.width=w*d;cv.height=h*d}
 const g=cv.getContext("2d");g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);
 if(!fpOn||!FPD||!FPD.bars.length||candles.length<2){return}
 const ts=chart.timeScale(),n=candles.length,bs=Math.abs(ts.timeToCoordinate(candles[n-1].time)-ts.timeToCoordinate(candles[n-2].time));
 if(!(bs>6))return;const st=FPD.step,bw=bs*.86;g.textBaseline="middle";
 for(const b of FPD.bars){const x=ts.timeToCoordinate(b.t);if(x==null||x<-bs||x>w+bs)continue;
  const m={};let mx=0,poc=0;for(const[p,bd,a]of b.l){m[p]=[bd,a];if(bd+a>mx){mx=bd+a;poc=p}}
  for(const[p,bd,a]of b.l){const y=ser.priceToCoordinate(p+st/2),y2=ser.priceToCoordinate(p-st/2);if(y==null||y2==null)continue;
   const ch=y2-y,t=bd+a,dom=a>=bd,k=Math.min(1,t/(mx||1));
   g.fillStyle=dom?`rgba(14,203,129,${.12+.4*k})`:`rgba(246,70,93,${.12+.4*k})`;g.fillRect(x-bw/2,y+.5,bw,ch-1);
   const lo=m[+(p-st).toFixed(10)],hi=m[+(+p+ +st).toFixed(10)];
   if(lo&&a>=3*lo[0]&&a>0){g.strokeStyle="#0ecb81";g.lineWidth=1.2;g.strokeRect(x,y+.5,bw/2,ch-1)}
   if(hi&&bd>=3*hi[1]&&bd>0){g.strokeStyle="#f6465d";g.lineWidth=1.2;g.strokeRect(x-bw/2,y+.5,bw/2,ch-1)}
   if(p==poc){g.strokeStyle="#f0b90b";g.lineWidth=1.5;g.strokeRect(x-bw/2,y+.5,bw,ch-1)}
   if(bs>38&&ch>9){g.font=`${Math.min(11,ch-2)}px Inter,sans-serif`;g.fillStyle="#eaecef";g.textAlign="right";g.fillText(sh(bd),x-2,y+ch/2);g.textAlign="left";g.fillText(sh(a),x+2,y+ch/2)}}}}
const sh=v=>v>=1000?(v/1000).toFixed(1)+"K":v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2);
(function loop(){draw();requestAnimationFrame(loop)})();

/* signals: clean — only markers, level lines for the active trade, one small card */
async function loadSig(){try{SIG=await api(`/api/signals?symbol=${sym}`)}catch(e){return}renderSig()}
function renderSig(){lines.forEach(l=>ser.removePriceLine(l));lines=[];const c=$("#card");
 if(!sigOn||!SIG){ser.setMarkers([]);c.style.display="none";return}
 const sec=TF[tf];ser.setMarkers(SIG.history.map(s=>({time:Math.floor(s.ts/sec)*sec,position:s.side=="BUY"?"belowBar":"aboveBar",
  color:s.side=="BUY"?"#0ecb81":"#f6465d",shape:s.side=="BUY"?"arrowUp":"arrowDown",text:s.side+(s.status!="OPEN"?" · "+s.status:"")}))
  .sort((a,b)=>a.time-b.time).filter((m,i,a)=>!i||a[i-1].time!=m.time));
 const a=SIG.active;c.style.display="block";
 if(a){const L=(p,t,col)=>lines.push(ser.createPriceLine({price:p,color:col,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:t}));
  L(a.entry,"Entry","#eaecef");L(a.sl,"SL","#f6465d");L(a.tp1,"TP1","#0ecb81");L(a.tp2,"TP2","#0ecb81");
  c.innerHTML=`<b class="${a.side.toLowerCase()}">${a.side}</b> ${a.sym} · ${a.mode}/${a.tf}${a.tp1_hit?" · TP1 hit":""}
  <div class="g"><span>Entry <b>${fmt(a.entry)}</b></span><span>SL <b>${fmt(a.sl)}</b></span><span>TP1 <b>${fmt(a.tp1)}</b></span><span>TP2 <b>${fmt(a.tp2)}</b></span><span>Score <b>${a.score}/7</b></span></div>`}
 else c.innerHTML=SIG.trading_day?`<span style="color:var(--mu)">Scanning ${sym} · ${SIG.mode} mode — waiting for a confirmed setup</span>`:
  `<span style="color:var(--mu)">Signals paused — trading days are Mon–Thu (UTC)</span>`}

/* UI */
const tfb=$("#tfs");Object.keys(TF).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{tf=k;mark();load()};tfb.append(b)});
const mark=()=>[...tfb.children].forEach(b=>b.classList.toggle("on",b.textContent==tf));mark();
$("#bfp").onclick=e=>{fpOn=!fpOn;e.target.classList.toggle("on",fpOn);loadFP()};
$("#bsig").onclick=e=>{sigOn=!sigOn;e.target.classList.toggle("on",sigOn);renderSig()};
$("#sym").onchange=e=>{let s=e.target.value.trim().toUpperCase();if(!s)return;if(!s.endsWith("USDT"))s+="USDT";e.target.value=sym=s;load()};
$("#mode").onchange=async e=>{try{await api("/api/mode",{m:"POST",b:{mode:e.target.value}});toast("Mode: "+e.target.value);loadSig()}catch(x){toast(x.message)}};
const open=(el,v)=>el.classList.toggle("show",v);
$("#bset").onclick=async()=>{try{const s=await api("/api/settings");$("#tt").value=s.tg_token;$("#tc").value=s.tg_chat}catch(e){}open($("#scrim"),true)};
$("#bclose").onclick=()=>open($("#scrim"),false);$("#scrim").onclick=e=>{if(e.target.id=="scrim")open($("#scrim"),false)};
const saveS=()=>api("/api/settings",{m:"POST",b:{tg_token:$("#tt").value,tg_chat:$("#tc").value}});
$("#bsave").onclick=async()=>{try{await saveS();toast("Settings saved");open($("#scrim"),false)}catch(e){toast(e.message)}};
$("#btest").onclick=async()=>{try{await saveS();await api("/api/telegram/test",{m:"POST",b:{}});toast("Test sent — check Telegram")}catch(e){toast(e.message)}};
$("#bwl").onclick=()=>{open($("#drawer"),true);loadWL()};$("#xwl").onclick=()=>open($("#drawer"),false);
async function loadWL(){try{const s=await api("/api/state");$("#mode").value=s.mode;$("#cnt").textContent=`${s.watchlist.length}/${s.max}`;
 $("#list").innerHTML=s.watchlist.length?"":'<div style="color:var(--mu)">No pairs yet. Add one above to start scanning it.</div>';
 s.watchlist.forEach(w=>{const d=document.createElement("div");d.className="it";d.dataset.s=w.s;
  d.innerHTML=`<span class="n">${w.s}</span>${w.sig?`<span class="tag ${w.sig.side}">${w.sig.side}</span>`:""}<span class="p" data-p="${w.s}">${fmt(w.p)}</span><button data-e>Edit</button><button data-d>✕</button>`;
  d.onclick=ev=>{if(ev.target.dataset.e!==undefined){const n=prompt("Replace "+w.s+" with:",w.s);if(n)api("/api/watchlist/"+w.s,{m:"PUT",b:{symbol:n}}).then(loadWL).catch(x=>toast(x.message))}
   else if(ev.target.dataset.d!==undefined)api("/api/watchlist/"+w.s,{m:"DELETE"}).then(loadWL);
   else{$("#sym").value=sym=w.s;open($("#drawer"),false);load()}};$("#list").append(d)})}catch(e){toast(e.message)}}
const add=async()=>{const v=$("#ns").value.trim();if(!v)return;try{await api("/api/watchlist",{m:"POST",b:{symbol:v}});$("#ns").value="";toast("Added");loadWL()}catch(e){toast(e.message)}};
$("#badd").onclick=add;$("#ns").onkeydown=e=>e.key=="Enter"&&add();

function connect(){const u=(location.protocol=="https:"?"wss://":"ws://")+location.host+"/ws";wsk=new WebSocket(u);
 wsk.onopen=()=>wsk.send(JSON.stringify({symbol:sym}));
 wsk.onmessage=e=>{const m=JSON.parse(e.data);if(m.type=="tick"){if(m.s==sym)tick(m.p);
   if(m.all)for(const[s,p]of Object.entries(m.all)){const el=document.querySelector(`[data-p="${s}"]`);if(el)el.textContent=fmt(p)}}
  else if(m.type=="signal"){loadSig();if($("#drawer").classList.contains("show"))loadWL()}};
 wsk.onclose=()=>setTimeout(connect,2000)}
$("#sym").value=sym;connect();load();setInterval(loadFP,2000);setInterval(loadSig,15000);setInterval(()=>candles.length&&document.visibilityState=="visible"&&load(),120000);
api("/api/state").then(s=>$("#mode").value=s.mode).catch(()=>{});
</script></body></html>
